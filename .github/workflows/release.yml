name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip build twine
        pip install ./client[dev]
    - name: Verify git tag matches pyproject.toml version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        PACKAGE_VERSION="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("client/pyproject.toml").read_text())["project"]["version"])')"
        if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
          echo "Error: Tag version $TAG_VERSION does not match pyproject.toml version $PACKAGE_VERSION"
          exit 1
        fi
        echo "Tag $TAG_VERSION matches pyproject.toml version."
    - name: Run test suite
      run: |
        pytest tests -v
    - name: Build package
      run: |
        python -m build client
    - name: Check package metadata with twine
      run: |
        twine check client/dist/*
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: client/dist/

  publish-pypi:
    needs: validate-and-test
    runs-on: ubuntu-latest
    environment: pypi
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.test_pypi
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

  publish-testpypi:
    needs: validate-and-test
    runs-on: ubuntu-latest
    environment: testpypi
    if: inputs.test_pypi
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/
