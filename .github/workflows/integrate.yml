name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-client:
    name: client (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies and package in editable mode
      run: |
        python -m pip install --upgrade pip build
        pip install ./client[dev]
    - name: Run unit and CLI tests
      run: |
        pytest tests -v
    - name: Build distribution packages (wheel and sdist)
      run: |
        python -m build client
    - name: Test CLI entry point
      run: |
        neoshell --version
        neoshell --help
        python -m neoshell --help
        python client/main.py --help

  node-server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install dependencies
      run: |
        cd server
        npm install
    - name: Syntax check Node server
      run: |
        node --check server/src/index.js

  integration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: personal_cloud
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_cloud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SERVER_URL: http://127.0.0.1:8080
      SERVER_PORT: "8080"
      AUTH_TOKEN: ci-smoke-token
      DB_SSL: "false"
      NEON_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/personal_cloud
      S3_BUCKET: ci-neoshell
      S3_ACCESS_KEY_ID: mock-access-key
      S3_SECRET_ACCESS_KEY: mock-secret-key
      S3_REGION: us-east-1
      S3_ENDPOINT: http://127.0.0.1:9090
      S3_FORCE_PATH_STYLE: "true"
    steps:
    - uses: actions/checkout@v4
    - name: Start S3 Mock service
      run: |
        docker run -d --name s3mock \
          -p 9090:9090 \
          -e initialBuckets=ci-neoshell \
          adobe/s3mock:latest
    - name: Wait for S3 Mock
      run: |
        python - <<'PY'
        import time, urllib.request
        deadline = time.time() + 30
        while time.time() < deadline:
            try:
                with urllib.request.urlopen("http://127.0.0.1:9090", timeout=1) as resp:
                    if resp.status == 200:
                        print("s3mock-ready")
                        break
            except Exception:
                time.sleep(0.5)
        else:
            raise SystemExit("S3 mock did not start in time")
        PY
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install CLI package
      run: |
        python -m pip install --upgrade pip
        pip install ./client
    - name: Install server dependencies
      run: |
        cd server
        npm install
    - name: Start server
      run: |
        node server/src/index.js > server.log 2>&1 &
        echo $! > server.pid
    - name: Wait for server
      run: |
        python - <<'PY'
        import time
        import urllib.request
        deadline = time.time() + 30

        while time.time() < deadline:
            try:
                with urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=1) as response:
                    if response.status != 200:
                        raise OSError(response.status)
                    print("server-ready")
                    break
            except OSError:
                time.sleep(0.5)
        else:
            raise SystemExit("Server did not start in time")
        PY
    - name: Run automated smoke test
      run: |
        python scripts/smoke_test.py
    - name: Run CLI end-to-end commands
      run: |
        neoshell login --url http://127.0.0.1:8080 --token ci-smoke-token
        neoshell status
        neoshell upload sample.txt
        neoshell list
        neoshell download sample.txt -o /tmp/sample_downloaded.txt
        diff sample.txt /tmp/sample_downloaded.txt
        neoshell share sample.txt --expires 1h
        neoshell delete sample.txt --yes
    - name: Show server log on failure
      if: failure()
      run: |
        test -f server.log && cat server.log || true
    - name: Stop server
      if: always()
      run: |
        test -f server.pid && kill "$(cat server.pid)" || true
