services:
  server:
    build:
      context: ./server
    user: "65532:65532"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=${SERVER_PORT:-8080}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - DB_SSL=${DB_SSL:-true}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||8080)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloud_net

  client:
    build:
      context: ./client
    env_file:
      - .env
    environment:
      - SERVER_URL=http://server:${SERVER_PORT:-8080}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
    depends_on:
      - server
    stdin_open: true
    tty: true
    networks:
      - cloud_net

networks:
  cloud_net:
